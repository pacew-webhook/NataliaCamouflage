name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write   # dibutuhkan untuk membuat GitHub Release berisi APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "natalia_camouflage.tflite"
          APKSIGNER="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK" | head -20
          fi
          echo "APK OK: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NataliaCamouflage-v3.2.0-debug.apk
          ls -la NataliaCamouflage-v3.2.0-debug.apk
          SIZE=$(stat -c %s NataliaCamouflage-v3.2.0-debug.apk)
          SHA=$(sha256sum NataliaCamouflage-v3.2.0-debug.apk | cut -d' ' -f1)
          {
            echo "## APK siap"
            echo ""
            echo "- Ukuran yang BENAR: **$SIZE byte** (~$((SIZE / 1024 / 1024)) MB)"
            echo "- SHA-256: \`$SHA\`"
            echo ""
            echo "Kalau file yang terunduh di HP ukurannya jauh lebih kecil, unduhannya gagal (bukan APK/zip yang asli)."
            echo "Unduh dari **Releases** (file .apk langsung): https://github.com/${{ github.repository }}/releases"
          } >> "$GITHUB_STEP_SUMMARY"

      # Cara TERMUDAH di HP: APK langsung bisa diunduh (bukan .zip) dari halaman Releases.
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.2.0-build${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" NataliaCamouflage-v3.2.0-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Natalia Camouflage 3.2.0 (build ${{ github.run_number }})" \
            --notes "Debug APK. Unduh file .apk lalu install langsung, tidak perlu di-extract." \
            --prerelease

      # Cadangan: GitHub selalu membungkus artifact dalam 1 lapis zip. APK diupload
      # langsung (TANPA di-zip lagi) supaya tidak jadi zip di dalam zip.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NataliaCamouflage-v3.2.0-debug-apk
          path: NataliaCamouflage-v3.2.0-debug.apk
          if-no-files-found: error
          compression-level: 0   # APK sudah terkompres; tanpa kompresi ulang lebih kompatibel

      - name: Upload build reports (jika build gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports
          if-no-files-found: ignore
