name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Gradle and Kotlin configuration
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon :app:dependencies --configuration debugCompileClasspath > /tmp/dependencies.txt
          grep -E "kotlin-stdlib|litert" /tmp/dependencies.txt | head -50 || true

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK before packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          fi
          echo "APK verified: $(du -h "$APK" | cut -f1)"
      - name: Verify signing certificate (harus sama di setiap build)
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          keytool -printcert -jarfile "$APK" | grep -E "Owner|SHA256" || true

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Package APK into ZIP
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="NataliaCamouflage-v3.1.0-debug.zip"
          rm -f "$OUT"
          zip -q -j "$OUT" "$APK"
          unzip -t "$OUT"
          sha256sum "$OUT"

      - name: Upload verified ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NataliaCamouflage-v3.1.0-debug
          path: NataliaCamouflage-v3.1.0-debug.zip
          if-no-files-found: error

      - name: Upload build reports (jika build gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            /tmp/dependencies.txt
          if-no-files-found: ignore
