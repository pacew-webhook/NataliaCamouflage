name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact (uncompressed)
        uses: actions/upload-artifact@v4
        with:
          name: NataliaCamouflage-v1.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1-build-${{ github.run_number }}"
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#NataliaCamouflage-v1.1-debug.apk" \
            --title "NataliaCamouflage v1.1 Build ${{ github.run_number }}" \
            --notes "Debug APK built by GitHub Actions. CameraX 1.5.3 / compileSdk 35." \
            --target "${{ github.sha }}"
