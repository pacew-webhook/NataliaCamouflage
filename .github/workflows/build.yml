name: Build Android APK - ZIP Artifact

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK before packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          fi
          echo "APK verified: $(du -h "$APK" | cut -f1)"

      - name: Upload APK as downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NataliaCamouflage-v1.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
